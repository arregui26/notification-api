name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notifications
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: notifications_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U notifications -d notifications_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      API_KEY: test-only-not-a-real-secret-1234567890
      DATABASE_URL: postgresql+psycopg://notifications:ci-only-password@localhost:5432/notifications_test
      TEST_DATABASE_URL: postgresql+psycopg://notifications:ci-only-password@localhost:5432/notifications_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: docker build -t notification-api:ci .
